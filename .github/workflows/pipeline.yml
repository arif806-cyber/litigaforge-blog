name: LitigaForge Content Pipeline

# ─── TRIGGERS ────────────────────────────────────────────
on:
  schedule:
    # Runs every 2 hours — uses ~36 min/day of GitHub's 2,000 free minutes
    - cron: '0 */2 * * *'

  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      max_articles:
        description: 'Max articles to publish this run'
        required: false
        default: '3'

# ─── JOB ─────────────────────────────────────────────────
jobs:
  publish:
    name: Publish Legal Content
    runs-on: ubuntu-latest   # free runner

    # Prevent parallel runs if one is already running
    concurrency:
      group: content-pipeline
      cancel-in-progress: false

    # Required permissions for the auto-generated GITHUB_TOKEN
    permissions:
      contents: write          # push articles to src/content/blog/
      actions: write           # cache published_slugs.json

    steps:
      # 1. Check out the repo (so pipeline.py can commit files back)
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_PERSONAL_ACCESS_TOKEN || secrets.GITHUB_PERSONAL_ACCESS_TOKEN_NOEXPIRE || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      # 2. Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          pip install httpx --quiet

      # 4. Restore published slugs cache (avoid re-publishing same articles)
      - name: Restore published slugs cache
        uses: actions/cache@v4
        with:
          path: published_slugs.json
          key: published-slugs-${{ github.run_number }}
          restore-keys: |
            published-slugs-

      # 5. Run the pipeline
      - name: Run content pipeline
        env:
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN:    ${{ secrets.GITHUB_PERSONAL_ACCESS_TOKEN || secrets.GITHUB_PERSONAL_ACCESS_TOKEN_NOEXPIRE || secrets.GITHUB_TOKEN }}
          GITHUB_REPO:     ${{ github.repository }}
          INDEXNOW_KEY:    ${{ secrets.INDEXNOW_KEY }}
          BLOG_DOMAIN:     ${{ secrets.BLOG_DOMAIN || 'blog.litigaforge.com' }}
          SCORE_THRESHOLD: "60"
          MAX_ARTICLES:    ${{ github.event.inputs.max_articles || '3' }}
        run: python pipeline.py

      # 6. Save updated published slugs
      - name: Save published slugs cache
        uses: actions/cache@v4
        with:
          path: published_slugs.json
          key: published-slugs-${{ github.run_number }}

      # 7. Upload run log as artifact (for debugging)
      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log-${{ github.run_number }}
          path: published_slugs.json
          retention-days: 30
